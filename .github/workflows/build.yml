name: Build Asahi Linux kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout kernel repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            libdw-dev \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            pkg-config \
            python3 \
            rsync \
            dwarves

      - name: Show kernel version
        run: |
          make -s kernelversion

      - name: Install Ubuntu Asahi config
        run: |
          test -f config/config-7.0.0-1002-asahi-arm
          cp config/config-7.0.0-1002-asahi-arm .config

      - name: Update config for this kernel
        run: |
          make olddefconfig

      - name: Show kernel configuration
        run: |
          echo "=== Architecture ==="
          grep '^CONFIG_ARM64=' .config || true
          grep '^CONFIG_ARM64_16K_PAGES=' .config || true

          echo
          echo "=== Apple / Asahi ==="
          grep -Ei \
            '^(CONFIG_.*(APPLE|ASAHI|AGX|DART|NVME_APPLE|USB.*APPLE|I2C_APPLE|SPI_APPLE|PINCTRL_APPLE|SND_.*APPLE))=' \
            .config || true

      - name: Save generated config
        run: |
          mkdir -p artifacts
          cp .config artifacts/config-generated

      - name: Build Debian packages
        run: |
          make -j"$(nproc)" bindeb-pkg \
            KDEB_PKGVERSION="$(make -s kernelversion)-asahi-custom.${GITHUB_RUN_NUMBER}"

      - name: Collect packages
        run: |
          cp -v ../*.deb artifacts/

          echo "=== Built packages ==="
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asahi-kernel-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "kernel-${{ github.run_number }}"
          name: "Asahi kernel ${{ github.run_number }}"
          generate_release_notes: true
          files: |
            artifacts/*.deb
            artifacts/config-generated
